name: Build desktop app
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }
          uv run python scripts/build.py --installer
      - if: runner.os == 'macOS'
        run: uv run python scripts/build.py
      # Windows defaults to cu128 even on a runner without an NVIDIA GPU.
      - run: uv run python scripts/prepare_hybrid.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSkyPlay-Hybrid-${{ runner.os }}
          path: |
            dist/AutoSkyPlay-Hybrid-*.zip
            dist/AutoSkyPlay-Hybrid-*.zip.sha256
      - name: Release hybrid build disk space before building the second runtime
        shell: python
        run: |
          import shutil
          from pathlib import Path
          for name in ('hybrid-venv', 'hybrid-dist', 'hybrid-pyinstaller'):
              shutil.rmtree(Path('build') / name)
          for path in Path('dist').glob('AutoSkyPlay-Hybrid-*.zip*'):
              path.unlink()
      - run: uv run python scripts/prepare_muscriptor.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSkyPlay-${{ runner.os }}
          path: |
            dist/AutoSkyPlay-Setup.exe
            dist/AutoSkyPlay.dmg
            dist/AutoSkyPlay/**
            dist/AutoSkyPlay-MuScriptor-*.zip
            dist/AutoSkyPlay-MuScriptor-*.zip.sha256

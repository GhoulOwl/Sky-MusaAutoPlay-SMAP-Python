[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoskyplay"
version = "0.1.0"
description = "Python desktop rewrite of Sky Musa Auto Play"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "PySide6>=6.8,<7", "numpy>=1.26,<3", "soundfile>=0.12,<1",
  "mido>=1.3,<2", "httpx>=0.27,<1", "platformdirs>=4,<5", "packaging>=24",
  "pynput>=1.7,<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9", "pyinstaller>=6,<7"]

[project.scripts]
autoskyplay = "autoskyplay.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoskyplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
